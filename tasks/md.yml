---
- name: Apache mod_md tasks
  block:

    - name: Apache mod_md source code absent
      ansible.builtin.file:
        path: /usr/local/src/mod_md
        state: absent

    - name: Read local facts  # noqa: no-handler
      ansible.builtin.setup:
        filter: ansible_local
      check_mode: false
      changed_when: false

    - name: Include Apache mod_md cert copy tasks
      ansible.builtin.include_tasks: md_cert_cp.yml
      loop: "{{ apache_md_cert_copy }}"
      loop_control:
        loop_var: apache_md_cert_cp
        label: "{{ apache_md_cert_cp.name }}"
      when:
        - apache_md_cert_copy is defined
        - apache_md_cert_copy != []
        - apache_md_cert_cp.pkgs | ansible.builtin.difference(ansible_facts.packages.keys()) == []

    - name: Apache reload script in place
      ansible.builtin.template:
        src: apache_md_cert_reload.sh.j2
        dest: /usr/local/bin/apache_md_cert_reload.sh
        owner: root
        group: root
        mode: "0750"

    - name: Stat the Apache reload script path
      ansible.builtin.stat:
        path: /usr/local/bin/apache_md_cert_reload.sh
      register: apache_md_cert_reload_path

    - name: Run the Apache reload script when it is present
      ansible.builtin.command:
        cmd: /usr/local/bin/apache_md_cert_reload.sh
      environment:
        PATH: usr/local/bin:/usr/bin:/bin
      check_mode: false
      register: apache_md_cert_reload
      changed_when: ("Reloading Apache for new certificates" in apache_md_cert_reload.stdout)

    - name: Apache reload script checked and cron job in place
      block:

        - name: Check the Apache reload script
          ansible.builtin.command:
            cmd: /usr/local/bin/apache_md_cert_reload.sh
          check_mode: false
          changed_when: false

        - name: Crontab for Apache reload script in place
          ansible.builtin.cron:
            name: "Apache mod_md certificate reload"
            special_time: hourly
            job: /usr/local/bin/apache_md_cert_reload.sh

      when:
        - ("md" in ansible_facts.ansible_local.a2query.modules_enabled)
        - apache_md_cert_reload_path.stat.exists | ansible.builtin.bool

    - name: Check Apache md-status
      block:

        - name: "Get the Apache md-status for {{ inventory_hostname }}"
          ansible.builtin.uri:
            url: http://localhost/md-status
            return_content: true
            status_code: 200
            method: get
          delegate_to: "{{ inventory_hostname }}"
          check_mode: false
          changed_when: false
          register: apache_md_status_get

      rescue:

        - name: Apache localhost site available
          ansible.builtin.template:
            src: localhost.conf.j2
            dest: "/etc/apache2/sites-available/localhost.conf"
            owner: root
            group: root
            mode: "0644"
            backup: true

        - name: Apache localhost site enabled
          ansible.builtin.command:
            cmd: a2ensite localhost
            creates: /etc/apache2/sites-enabled/localhost.conf
          when: ("localhost" in apache_sites_enabled)

        - name: Restart Apache in case that fixes the Apache md-status failure
          ansible.builtin.service:
            name: apache2
            state: restarted

        - name: "Get the Apache md-status for {{ inventory_hostname }}"
          ansible.builtin.uri:
            url: http://localhost/md-status
            return_content: true
            status_code: 200
            method: get
          delegate_to: "{{ inventory_hostname }}"
          check_mode: false
          changed_when: false
          register: apache_md_status_get

    - name: Debug apache_md_status_get.json
      ansible.builtin.debug:
        var: apache_md_status_get.json
        verbosity: >-
          {% if (ansible_check_mode | ansible.builtin.bool) or (ansible_diff_mode | ansible.builtin.bool) %}2{% else %}3{% endif %}
      tags:
        - debug

    - name: Set a fact for the mod_md certificate domain names
      ansible.builtin.set_fact:
        apache_mod_md_cert_domains: >-
          {{ apache_md_status_get.json | community.general.json_query(apache_jpq.mod_md_cert_domains)
          | ansible.builtin.sort(attribute='name') }}

    - name: Debug apache_mod_md_cert_domains
      ansible.builtin.debug:
        var: apache_mod_md_cert_domains
        verbosity: >-
          {% if (ansible_check_mode | ansible.builtin.bool) or (ansible_diff_mode | ansible.builtin.bool) %}1{% else %}2{% endif %}
      tags:
        - debug

    - name: Set a fact for all the subjectAltNames
      ansible.builtin.set_fact:
        apache_mod_md_cert_all_domains: >-
          {{ apache_mod_md_cert_domains | community.general.json_query(apache_jpq.mod_md_cert_all_domains) | ansible.builtin.sort }}

    - name: Debug apache_mod_md_cert_all_domains
      ansible.builtin.debug:
        var: apache_mod_md_cert_all_domains
        verbosity: >-
          {% if (ansible_check_mode | ansible.builtin.bool) or (ansible_diff_mode | ansible.builtin.bool) %}1{% else %}2{% endif %}
      tags:
        - debug

    - name: Debug ansible_facts.ansible_local.apachectl.virtual_hosts
      ansible.builtin.debug:
        var: ansible_facts.ansible_local.apachectl.virtual_hosts
        verbosity: >-
          {% if (ansible_check_mode | ansible.builtin.bool) or (ansible_diff_mode | ansible.builtin.bool) %}1{% else %}2{% endif %}
      tags:
        - debug

    - name: Set a fact for the active Apache VirtualHost ServerNames and ServerAliases
      ansible.builtin.set_fact:
        apache_virtual_host_domains: >-
          {{ ansible_facts.ansible_local.apachectl.virtual_hosts | community.general.json_query(apache_jpq.vhost_443_domains)
          | ansible.builtin.sort(attribute='name') }}

    - name: Debug apache_virtual_host_domains
      ansible.builtin.debug:
        var: apache_virtual_host_domains
        verbosity: >-
          {% if (ansible_check_mode | ansible.builtin.bool) or (ansible_diff_mode | ansible.builtin.bool) %}1{% else %}2{% endif %}
      tags:
        - debug

    - name: Set a fact for all the Apache ServerName and ServerAliases
      ansible.builtin.set_fact:
        apache_virtual_host_all_domains: >-
          {{ (apache_virtual_host_domains | community.general.json_query(apache_jpq.vhost_all_names)
          + apache_virtual_host_domains | community.general.json_query(apache_jpq.vhost_all_altnames))
          | ansible.builtin.sort }}

    - name: Debug apache_virtual_host_all_domains
      ansible.builtin.debug:
        var: apache_virtual_host_all_domains
        verbosity: >-
          {% if (ansible_check_mode | ansible.builtin.bool) or (ansible_diff_mode | ansible.builtin.bool) %}1{% else %}2{% endif %}
      tags:
        - debug

    - name: Apache VirtualHost ServerNames and ServerAliases missing from the mod_md certificates
      ansible.builtin.debug:
        var: apache_domains_not_in_certs
      vars:
        apache_domains_not_in_certs: >-
          {{ apache_virtual_host_all_domains | ansible.builtin.difference(apache_mod_md_cert_all_domains) }}
      when:
        - apache_domains_not_in_certs != []

    - name: Apache mod_md certificate subjectAltNames not listed in VirtualHost ServerNames and ServerAliases
      ansible.builtin.debug:
        var: apache_domains_not_in_vhosts
      vars:
        apache_domains_not_in_vhosts: >-
          {{ apache_mod_md_cert_all_domains | ansible.builtin.difference(apache_virtual_host_all_domains) }}
      when:
        - apache_domains_not_in_vhosts != []

    - name: "Suggested icinga_check_commands for certificates written to {{ apache_icinga_check_commands }}"
      ansible.builtin.template:
        src: icinga_check_commands.yml.j2
        dest: "{{ apache_icinga_check_commands }}"
        mode: "0644"
      become: false
      connection: local
      delegate_to: localhost
      check_mode: false
      vars:
        apache_icinga_check_commands: >-
          /tmp/icinga_check_commands_{{ inventory_hostname | ansible.builtin.regex_replace('[.]', '_') }}.yml
      when: apache_icinga_check_commands_suggestion | ansible.builtin.bool

  tags:
    - apache
...
