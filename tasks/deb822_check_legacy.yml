---
- name: "{{ apache_task_name }}"
  ansible.builtin.deb822_repository:
    allow_downgrade_to_insecure: false
    allow_insecure: false
    allow_weak: false
    architectures: "{{ ansible_facts.ansible_local.dpkg.arch }}"
    check_date: true
    check_valid_until: true
    components: main
    enabled: true
    name: apache
    pdiffs: true
    signed_by: /usr/share/keyrings/debsuryorg-archive-keyring.gpg
    suites: "{{ ansible_facts.distribution_release }}"
    types: deb
    uris: https://packages.sury.org/apache2/
  vars:
    apache_task_name: "Check Apache repository sources file present for apt {{ apache_apt_version }} and ansible {{ ansible_version.full }}"
  check_mode: true
  changed_when: false
  register: apache_sources_check
  tags:
    - apache
...
